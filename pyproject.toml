[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "node_modules", ".next", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the real sentence-transformers model (downloads ~90 MB on first run)"]
addopts = "-p no:cacheprovider"
